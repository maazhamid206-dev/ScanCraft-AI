name: Build ScanCraft AI APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir project
          unzip -q scancraftai-android.zip -d project

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache-dependency-path: project/package.json

      - name: Install dependencies
        working-directory: project
        run: npm install

      - name: Build web app
        working-directory: project
        run: npm run build

      - name: Sync Capacitor Android project
        working-directory: project
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK
        working-directory: project/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScanCraft-AI-APK
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
